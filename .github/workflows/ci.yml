name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Track the module's go directive instead of a hard-coded version
          # that drifts (it was 1.22 while go.mod required 1.25).
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        # golangci-lint must be built with a Go at least as new as go.mod's
        # go directive; v1.64.8 (built with Go 1.24) refused to run.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      - name: Unit and golden tests
        run: go test -race -count=1 -timeout 120s ./...

      - name: Integration tests
        run: go test -race -count=1 -timeout 120s -tags=integration ./...

      - name: Build binary
        run: go build ./cmd/realitycheck
